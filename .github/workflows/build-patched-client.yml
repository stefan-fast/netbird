name: Build patched NetBird client

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build netbird binary (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -ldflags "-s -w -X github.com/netbirdio/netbird/version.version=${{ steps.version.outputs.VERSION }}" \
            -o linux/amd64/netbird \
            ./client

      - name: Build netbird binary (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build \
            -ldflags "-s -w -X github.com/netbirdio/netbird/version.version=${{ steps.version.outputs.VERSION }}" \
            -o linux/arm64/netbird \
            ./client

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/stefan-fast/netbird:${{ steps.version.outputs.VERSION }}
            ghcr.io/stefan-fast/netbird:latest
